name: Deploy Frontend

run-name: Deploy to ${{ github.event_name == 'push' && 'prod' || inputs.environment }}

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - stage

concurrency:
  group: frontend-${{github.ref}}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. BUILD JOB
  # ============================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'push' && 'prod' || inputs.environment }}

    steps:
      # ----------------------------------------------------------
      # Checkout source code
      # ----------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Setup Node.js
      # ----------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ----------------------------------------------------------
      # Install dependencies
      # ----------------------------------------------------------
      - name: Install Dependencies
        run: npm ci

      # ----------------------------------------------------------
      # Build application
      # ----------------------------------------------------------
      - name: Build Application
        run: npm run build

      # ----------------------------------------------------------
      # Upload build artifact
      #
      # We upload the project files needed by the Deploy job.
      # node_modules and .git are excluded.
      # ----------------------------------------------------------
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: |
            .
            !.git
            !node_modules
          retention-days: 1

  # ============================================================
  # 2. DEPLOY JOB
  # ============================================================
  deploy:
    name: Deploy to Vercel

    # Deploy starts ONLY after Build succeeds
    needs: build

    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'push' && 'prod' || inputs.environment }}

    steps:
      # ----------------------------------------------------------
      # Download artifact created by Build job
      # ----------------------------------------------------------
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      # ----------------------------------------------------------
      # Setup Node.js
      # ----------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ----------------------------------------------------------
      # Verify build output
      # ----------------------------------------------------------
      - name: Verify Build Output
        run: |
          echo "Checking dist directory..."
          ls -la dist

          echo ""
          echo "Checking index.html..."
          test -f dist/index.html

          echo ""
          echo "Build artifact is valid."

      # ----------------------------------------------------------
      # Deploy to Vercel
      #
      # prod:
      #   Push to master -> Production deployment
      #
      # dev/stage:
      #   Manual workflow -> Preview deployment
      # ----------------------------------------------------------
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          ENVIRONMENT="${{ github.event_name == 'push' && 'prod' || inputs.environment }}"

          echo "Deploying to: $ENVIRONMENT"

          if [ "$ENVIRONMENT" = "prod" ]; then
            npx vercel deploy --prod --token="$VERCEL_TOKEN"
          else
            npx vercel deploy --token="$VERCEL_TOKEN"
          fi

      # ----------------------------------------------------------
      # Deployment completed
      # ----------------------------------------------------------
      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "Deployment Successful"
          echo "Environment: ${{ github.event_name == 'push' && 'prod' || inputs.environment }}"
          echo "=========================================="
