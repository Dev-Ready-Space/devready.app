name: Deploy Frontend
run-name: Deploy to ${{ github.event_name == 'push' && 'prod' || inputs.environment }}

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - stage

jobs:
  # ============================================================
  # 1. Build
  # ============================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      # Save dist/ so the deploy job can use it
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/

  # ============================================================
  # 2. Deploy
  # ============================================================

  deploy:
    name: Deploy to Vercel

    # Deploy can only start after the build succeeds
    needs: build
    runs-on: ubuntu-latest

    environment: ${{github.event_name == 'push' && 'prod' || inputs.environment }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Verify build artifact
        run: |
          echo "Contents of dist:"
          ls -la dist
          echo "Checking index.html:"
          test -f dist/index.html

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Vercel
        run: npx vercel deploy --prod --token=${{secrets.VERCEL_TOKEN}}
        env:
          VERCEL_ORG_ID: ${{secrets.VERCEL_ORG_ID}}
          VERCEL_PROJECT_ID: ${{secrets.VERCEL_PROJECT_ID}}
