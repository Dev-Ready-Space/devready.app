name: Deploy Frontend
run-name: Deploy to ${{ github.event_name == 'push' && 'prod' || inputs.environment }}

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - stage

jobs:
  # ============================================================
  # 1. BUILD
  # ============================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'prod' || inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Pull project settings & env vars from Vercel
      - name: Pull Vercel Environment
        run: npx vercel pull --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Build into Vercel's prebuilt format (.vercel/output/)
      - name: Build with Vercel
        run: npx vercel build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Pass the build output to the deploy job
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vercel-build
          path: .vercel/output/

  # ============================================================
  # 2. DEPLOY
  # ============================================================
  deploy:
    name: Deploy to Vercel
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'prod' || inputs.environment }}

    steps:
      # Checkout is still needed for vercel.json, package.json, etc.
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: vercel-build
          path: .vercel/output/

      # Deploy the prebuilt output without rebuilding
      - name: Deploy to Vercel
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Print selected environment
        run: echo "Selected environment ${{ github.event_name == 'push' && 'prod' || inputs.environment }}"
