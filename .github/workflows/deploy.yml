name: Deploy Frontend

run-name: Deploy to ${{ github.event_name == 'push' && 'prod' || inputs.environment }}

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - stage

jobs:
  # ============================================================
  # 1. BUILD JOB
  # ============================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'push' && 'prod' || inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------------
      # Remove any existing Vercel configuration
      # --------------------------------------------------------
      - name: Clear Vercel configuration
        run: rm -rf .vercel

      # --------------------------------------------------------
      # Pull Vercel project configuration
      # --------------------------------------------------------
      - name: Pull Vercel project configuration
        run: |
          npx vercel pull \
            --yes \
            --environment=production \
            --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # --------------------------------------------------------
      # Build using Vercel
      # --------------------------------------------------------
      - name: Build with Vercel
        run: |
          npx vercel build \
            --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # --------------------------------------------------------
      # Verify Vercel build output
      # --------------------------------------------------------
      - name: Verify Vercel build output
        run: |
          echo "Contents of .vercel:"
          ls -la .vercel

          echo ""
          echo "Contents of .vercel/output:"
          ls -la .vercel/output

          echo ""
          echo "Vercel output files:"
          find .vercel/output -maxdepth 3 -type f

      # --------------------------------------------------------
      # Upload Vercel deployment output
      # --------------------------------------------------------
      - name: Upload Vercel build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vercel-build
          path: .vercel/output
          retention-days: 1

  # ============================================================
  # 2. DEPLOY JOB
  # ============================================================
  deploy:
    name: Deploy to Vercel

    needs: build

    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'push' && 'prod' || inputs.environment }}

    steps:
      # --------------------------------------------------------
      # Download exact Vercel build output
      # --------------------------------------------------------
      - name: Download Vercel build artifact
        uses: actions/download-artifact@v4
        with:
          name: vercel-build
          path: .vercel/output

      # --------------------------------------------------------
      # Verify downloaded artifact
      # --------------------------------------------------------
      - name: Verify downloaded artifact
        run: |
          echo "Contents of .vercel/output:"
          ls -la .vercel/output

          echo ""
          echo "Vercel output files:"
          find .vercel/output -maxdepth 3 -type f

      # --------------------------------------------------------
      # Deploy prebuilt output
      # --------------------------------------------------------
      - name: Deploy prebuilt application
        run: |
          npx vercel deploy \
            --prebuilt \
            --prod \
            --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Print selected environment
        run: |
          echo "Successfully deployed to ${{ github.event_name == 'push' && 'prod' || inputs.environment }}"
