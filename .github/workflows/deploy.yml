name: Deploy Frontend
run-name: Deploy to ${{ github.event_name == 'push' && 'prod' || inputs.environment }}

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - stage

jobs:
  # ==========================================
  # 1. BUILD JOB
  # ==========================================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      # Upload build output and source files needed by Vercel
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: |
            .
            !.git
            !node_modules
          retention-days: 1

  # ==========================================
  # 2. DEPLOY JOB
  # ==========================================
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'prod' || inputs.environment }}

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          ENVIRONMENT="${{ github.event_name == 'push' && 'prod' || inputs.environment }}"
          if [ "$ENVIRONMENT" = "prod" ]; then
            npx vercel deploy --prod --token=$VERCEL_TOKEN
          else
            npx vercel deploy --token=$VERCEL_TOKEN
          fi

      - name: Print selected environment
        run: echo "Successfully deployed to ${{ github.event_name == 'push' && 'prod' || inputs.environment }}"
