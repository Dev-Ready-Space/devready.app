name: Deploy Frontend

run-name: Deploy to ${{ github.event_name == 'push' && 'prod' || inputs.environment }}

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - stage

jobs:
  # ============================================================
  # 1. BUILD
  # ============================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      # Create Vercel's prebuilt output
      - name: Build with Vercel
        run: npx vercel build
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Save Vercel's build output
      - name: Upload Vercel Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vercel-build
          path: .vercel/output/

  # ============================================================
  # 2. DEPLOY
  # ============================================================
  deploy:
    name: Deploy to Vercel

    # Deploy only after build succeeds
    needs: build

    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'push' && 'prod' || inputs.environment }}

    steps:
      # Download the exact build created by the Build job
      - name: Download Vercel Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: vercel-build
          path: .vercel/output/

      # Deploy the prebuilt output
      - name: Deploy to Vercel
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
