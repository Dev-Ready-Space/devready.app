name: CI
run-name: CI - ${{github.event_name}} - ${{github.ref_name}}

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

jobs:
  quality:
    name: Code Quality & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build Application
        run: npm run build
